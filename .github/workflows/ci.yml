name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Demo + CLI smoke
        run: |
          bun run demo > /tmp/demo.txt
          grep -q "cluster totals:" /tmp/demo.txt
          node dist/cli.js help > /dev/null
